[project]
name = "mlops-ii-course"
version = "0.1.0"
description = "Dependencias del curso de Machine Learning Ops II. Gestión de proyectos con uv."
authors = [{ name = "Jaime Riascos", email = "jandresrsalas@gmail.com" }]
license = "MIT"
requires-python = ">=3.9,<3.12"
keywords = ["MLOps", "Machine Learning", "Python", "FastAPI", "Airflow", "MLflow"]

dependencies = [
    # Ciencia de datos y ML
    "numpy>=1.26.4,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "scikit-learn>=1.4.2,<2.0.0",
    "joblib>=1.4.2,<2.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    # Core MLOps
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "pydantic>=2.7.1,<3.0.0",
    "mlflow>=2.13.0,<3.0.0",
    "requests>=2.32.3,<3.0.0",
    # Airflow y proveedores
    # Airflow: se actualizó el rango (el original 2.6–2.9 era incompatible con los proveedores fijados)
    "apache-airflow>=2.9.0,<2.11.0",
    "apache-airflow-providers-cncf-kubernetes>=7.12.0",
    "apache-airflow-providers-docker>=4.2.0",
    "apache-airflow-providers-postgres>=5.10.0",
    "apache-airflow-providers-sqlite>=4.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    # Airflow 2.9/2.10 requiere SQLAlchemy 1.4.x (se ajustó el pin original de 2.0.x)
    "sqlalchemy>=1.4.28,<2.0",
    # Data Lake (S3 / MinIO)
    "boto3>=1.34.116,<2.0.0",
    "minio>=7.2.5,<8.0.0",
    # Streaming
    "redis>=5.0.0,<6.0.0",
    # GraphQL y gRPC
    "strawberry-graphql[fastapi]>=0.222.1",
    "grpcio>=1.64.0,<2.0.0",
    "grpcio-tools>=1.64.0,<2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.4,<7.0.0",
    "jupyter>=1.0.0,<2.0.0",
    "black>=24.4.2,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "flake8>=7.1.0,<8.0.0",
]

# El repositorio es un conjunto de dependencias del curso, no un paquete instalable.
[tool.uv]
package = false
